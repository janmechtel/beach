[project]
name = "beach"
version = "0.1.0"
description = "Beach volleyball video analysis — cut detection and clip splitting"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "click>=8.1",
    "pydantic>=2.6",
    "google-genai>=1.69.0",
]

[project.scripts]
beach = "beach.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beach"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
]
